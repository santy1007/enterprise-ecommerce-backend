name: Node.js CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ecommerce-backend:ci -f dockerfile .