services:
  app:
    image: santu1007/ecommerce-backend:latest
    platform: linux/amd64

    container_name: ecommerce-backend

    ports:
      - "3000:3000"

    environment:
      MONGO_URI: mongodb://mongodb:27017/ecommerce
      NODE_ENV: development

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    external: true
